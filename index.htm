<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>素因数分解ベンチ</title>

        <style>
            body {
                background-color: aquamarine;
                text-align: center;
                margin: 0;
                padding: 1rem;
                box-sizing: border-box;
                overflow-wrap: anywhere;
            }
        </style>

        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>

    <body>
        <h1>素因数分解ベンチ 2.0</h1>
        <p>Prime Factorization Benchmark</p>
        <hr>
        <p>計算内容: 1145141919810を364364回素因数分解します。</p>
        <button id="start-benchmark" type="button">開始（シングル・マルチ両方）</button>
        <br>
        <br>
        <textarea id="log" readonly></textarea>
        <hr>
        <strong>かかった時間: <span id="bench-time"></span></strong> <br>
        <strong>シングル得点: <span id="bench-score-single">0 / 50</span></strong> <br>
        <strong>マルチ得点: <span id="bench-score-multi">0 / 50</span></strong> <br>
        <hr>
        <strong>総合得点: <span id="result-score">0 / 100</span></strong>
    </body>
</html>
