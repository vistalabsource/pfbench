<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>素因数分解ベンチマーク</title>

        <style>
            body {
                background-color: aquamarine;
                text-align: center;
                margin: 0;
                padding: 1rem;
                box-sizing: border-box;
                overflow-wrap: anywhere;
            }
        </style>

        <link rel="stylesheet" href="style.css">
        <script src="script.js?v=2.1.0" defer></script>
    </head>

    <body>
        <h1>素因数分解ベンチマーク 3.0</h1>
        <p>Prime Factorization Benchmark</p>
        <hr>
        <p>計算内容: 1145141919810364364を10秒間で何回素因数分解できるか計測します。</p>
        <button id="start-benchmark" type="button">開始（シングル・マルチ両方）</button>
        <br>
        <br>
        <div id="log">10秒間に素因数分解できた回数を計測します。</div> <br>
        <div id="bench-result">
            計測時間: 各方式10秒<br>
            <hr>
            <strong>シングル回数: <span id="display-single-score">0</span> 回<br>
            マルチ合計回数: <span id="display-multi-score">0</span> 回</strong>
    </body>
</html>
