<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>素因数分解ベンチ</title>

        <style>
            body {
                background-color: aquamarine;
                text-align: center;
                margin: 0;
                padding: 1rem;
                box-sizing: border-box;
                overflow-wrap: anywhere;
            }
        </style>

        <link rel="stylesheet" href="style.css">
        <script src="script.js?v=2.0.1" defer></script>
    </head>

    <body>
        <h1>素因数分解ベンチ 2.0</h1>
        <p>Prime Factorization Benchmark</p>
        <hr>
        <p>計算内容: 1145141919810を364364回素因数分解します。</p>
        <button id="start-benchmark" type="button">開始（シングル・マルチ両方）</button>
        <br>
        <br>
        <div id="log">総合得点の計算式: (シングル + マルチ) - 総処理時間</div> <br>
        <div id="bench-result">
            シングル秒: <span id="display-single-second">0.000</span> 秒<br>
            マルチ秒: <span id="display-multi-second">0.000</span> 秒<br>
            <hr>
            シングル得点: <span id="display-single-score">0</span> / 50 <br>
            マルチ得点: <span id="display-multi-score">0</span> / 50
            <hr>
            <strong>総合得点: <span id="display-total-score">0</span> / 100</strong>
        </div>
    </body>
</html>
